const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPct=v=>v==null?'<span class="neu">—</span>':'<span class="'+(v>=0?'up':'down')+'">'+(v>=0?'+':'')+v.toFixed(1)+'%</span>';
const fmtYi=v=>v==null?'<span class="neu">—</span>':v.toFixed(2)+'亿';
const CLS={confirm:'b-confirm',pending:'b-pending',fail:'b-fail',down:'b-down',none:'b-none'};
const TCLS={'业绩预告':'t-预告','业绩快报':'t-快报','正式财报':'t-正式财报'};
const esc2=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
function downloadCSV(filename, rows){
  const head=['代码','名称','公告日','类型','报告期','业绩摘要','同比%','归母净利(亿)','行业','断层状态','缺口','复盘标签','公告链接'];
  const lines=[head.map(esc2).join(',')];
  rows.forEach(s=>lines.push([s.code,s.name,s.date,s.type,s.rpt,s.brief,
    (s.yoy==null?'':s.yoy.toFixed(1)),(s.valyi==null?'':s.valyi.toFixed(2)),s.sw1||'',
    s.rlabel||'', s.gap_unfilled?'未回补':(s.rtype==='gap_filled'?'已回补':''), s.tag||'', s.url].map(esc2).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=filename+'_'+DATA.summary.basisDate+'.csv';document.body.appendChild(a);a.click();a.remove();
}
let activeDate='';
$('#basis').textContent=DATA.summary.basisDate||'';
$('#updated').textContent='数据更新于 '+(DATA.summary.generatedAt||'');
const sm=DATA.summary;
function cnt(rtype){return DATA.stocks.filter(s=>s.rtype===rtype).length;}
$('#kpis').innerHTML=[['total','披露事件'],['业绩预告'],['业绩快报'],['正式财报'],
  ['pg','跳空确认·未回补','c'],['ft','平开转强','c'],['pending','待确认','p'],['fail','断层未遂','f']].map(([k,l,c])=>{
    let v;
    if(k==='total') v=sm.total;
    else if(k==='pending') v=sm.gapCounts.pending;
    else if(k==='fail') v=sm.gapCounts.gap_up_failed;
    else if(k==='pg') v=cnt('profit_gap_confirmed');
    else if(k==='ft') v=cnt('flat_then_confirmed');
    else v=sm.byType[k]||0;
    return '<div class="kpi '+(c||'')+'"><b>'+v+'</b><span>'+(l||k)+'</span></div>';
  }).join('');
const rail=$('#rail');
const allBtn=document.createElement('button'); allBtn.innerHTML='<b>全部</b>'+(DATA.stocks.length)+'条'; allBtn.className='on';
allBtn.onclick=()=>{activeDate='';syncRail();renderCal();}; rail.appendChild(allBtn);
DATA.dates.forEach(d=>{const n=DATA.stocks.filter(s=>s.date===d).length;const b=document.createElement('button');
  b.innerHTML='<b>'+d.slice(5)+'</b>'+n+'条'; b.dataset.d=d;
  b.onclick=()=>{activeDate=d;syncRail();renderCal();}; rail.appendChild(b);});
function syncRail(){[...rail.children].forEach((b,i)=>b.classList.toggle('on', i===0?!activeDate:b.dataset.d===activeDate));}
function renderCal(){
  const tv=$('#cal-type').value, rv=$('#cal-rpt').value, q=$('#cal-q').value.trim().toLowerCase();
  let rows=DATA.stocks.filter(s=>(!activeDate||s.date===activeDate)&&(!tv||s.type===tv)&&(!rv||s.rpt===rv)&&
    (!q||(s.code+s.name+(s.sw1||'')+(s.brief||'')).toLowerCase().includes(q)));
  $('#cal-cnt').textContent='共 '+rows.length+' 条';
  window._calRows=rows;
  const g={}; rows.forEach(s=>(g[s.date]=g[s.date]||[]).push(s));
  const dates=Object.keys(g).sort().reverse();
  if(!rows.length){$('#cal-body').innerHTML='<div class="empty">无匹配记录</div>';return;}
  let h='';
  dates.forEach(d=>{
    h+='<div class="day"><div class="dayhdr"><h2>'+d+'</h2><small>'+g[d].length+' 条</small></div>';
    g[d].forEach(s=>{
      h+='<div class="card"><div><div class="nm">'+esc(s.name)+'</div><div class="cd">'+esc(s.code)+'</div></div>'+
        '<div class="mid"><span class="badge '+TCLS[s.type]+'">'+esc(s.type)+'</span> <span class="tag">'+esc(s.rpt)+'</span>'+
        '<div class="brief">'+esc(s.brief)+'</div>'+
        '<div class="meta"><span>同比 '+fmtPct(s.yoy)+'</span><span>归母 '+fmtYi(s.valyi)+'</span>'+
        '<span>'+(s.sw1||'—')+'</span></div></div>'+
        '<div class="right"><a class="lk" href="'+s.url+'" target="_blank" rel="noopener">公告原文 ↗</a></div></div>';
    });
    h+='</div>';
  });
  $('#cal-body').innerHTML=h;
}
const GAP_ORDER={confirm:0,pending:1,fail:2,filled:3};
const SVMAP={'pg':'profit_gap_confirmed','ft':'flat_then_confirmed','pending':'pending_reaction','fail':'gap_up_failed','filled':'gap_filled'};
function renderGap(){
  const sv=$('#gap-status').value, tv=$('#gap-tag').value, q=$('#gap-q').value.trim().toLowerCase();
  let rows=DATA.stocks.filter(s=>{const g=(DATA.gapStatus&&DATA.gapStatus[s.rtype])||'none';
    const svOk = !sv || (SVMAP[sv] ? s.rtype===SVMAP[sv] : g===sv);
    return ['confirm','pending','fail','filled'].includes(g)&&svOk&&(!tv||s.tag===tv)&&
      (!q||(s.code+s.name+(s.sw1||'')+(s.brief||'')).toLowerCase().includes(q));});
  $('#gap-cnt').textContent='共 '+rows.length+' 只';
  window._gapRows=rows;
  rows.sort((a,b)=>(GAP_ORDER[(DATA.gapStatus&&DATA.gapStatus[a.rtype])||'none']-(DATA.gapStatus&&DATA.gapStatus[b.rtype])||'none')||((b.yoy||0)-(a.yoy||0)));
  if(!rows.length){$('#gap-body').innerHTML='<div class="empty">无匹配记录</div>';return;}
  let h='<table><thead><tr><th style="width:124px">代码/名称</th><th style="width:130px">行业</th>'+
    '<th style="width:66px">公告日</th><th style="width:70px">类型</th><th>业绩摘要</th><th style="width:76px">同比</th>'+
    '<th style="width:104px">首日现象</th><th style="width:84px">缺口</th><th style="width:80px">复盘</th><th style="width:76px">原文</th></tr></thead><tbody>';
  rows.forEach(s=>{const c=(DATA.gapStatus&&DATA.gapStatus[s.rtype])||'none';
    const gapbadge = s.gap_unfilled ? '<span class="badge b-confirm">未回补</span>' :
      (s.rtype==='gap_filled' ? '<span class="badge b-none">已回补</span>' : '<span class="neu">—</span>');
    h+='<tr><td><div class="nm">'+esc(s.name)+'</div><div class="cd">'+esc(s.code)+'</div></td>'+
      '<td><span class="tag">'+(s.sw1||'—')+'</span></td>'+
      '<td class="tag">'+esc(s.date)+'</td><td><span class="badge '+TCLS[s.type]+'">'+esc(s.type)+'</span></td>'+
      '<td class="brief" style="color:#2b2f36">'+esc(s.brief)+'</td><td>'+fmtPct(s.yoy)+'</td>'+
      '<td><span class="badge '+CLS[c]+'">'+esc(RT[s.rtype]||s.rtype)+'</span></td>'+
      '<td>'+gapbadge+'</td>'+
      '<td><span class="tag '+(s.tag||'')+'">'+(s.tag||'')+'</span></td>'+
      '<td><a class="lk" href="'+s.url+'" target="_blank" rel="noopener">原文 ↗</a></td></tr>';
  });
  h+='</tbody></table>'; $('#gap-body').innerHTML=h;
}
const gc=sm.gapCounts;
const SEGS=[['profit_gap_confirmed','c','跳空确认·未回补'],['flat_then_confirmed','c2','平开转强'],
  ['pending','p','待确认'],['gap_up_failed','f','断层未遂'],['gap_filled','m','跳空已回补']];
const tot=SEGS.reduce((a,[k])=>a+(gc[k]||0),0)||1;
$('#dist').innerHTML=SEGS.map(([k,cls,lab])=>{
  const v=gc[k]||0; if(!v) return '';
  return '<div class="'+cls+'" style="width:'+(v/tot*100)+'%">'+(v>=6?lab+' '+v:v)+'</div>';
}).join('');
$('#lg-pg').textContent=gc.profit_gap_confirmed; $('#lg-ft').textContent=gc.flat_then_confirmed;
$('#lg-pending').textContent=gc.pending; $('#lg-fail').textContent=gc.gap_up_failed; $('#lg-filled').textContent=gc.gap_filled;
$('#dirstrip').innerHTML=DATA.directions.slice(0,12).map(d=>
  '<div class="dirchip">'+esc(d.dir)+' · <b>'+(d.gap20||0)+'</b> 只</div>').join('');
$('#note').innerHTML='说明：本看板数据来自东方财富数据中心（业绩预告/快报/财报）、腾讯行情（逐日K线·前复权·含最高最低价）与东方财富行业分类，'+
  '为实时拉取、非静态快照（基准日 '+esc(sm.basisDate)+'）。中报披露窗口自 2026-07-01 起统计，已剔除北交所与上市三个月内新股（上市日晚于 '+esc(sm.ipoCutoff||'')+'）。'+
  '<br>断层判定（净利润断层）：以公告日后首交易日相对前日收盘/最高价判定 —— '+
  '<b>跳空确认</b>=当日最低价高于前日最高价（标准K线缺口、开盘跳空且盘中未回落）且相对前收跳空≥1%、当日收涨且<b>缺口至今未回补</b>；'+
  '<b>平开转强</b>=开盘未形成向上缺口且跳空∈(-1%,1%)，但当日收涨≥2%；'+
  '<b>高开回落</b>=高开（相对前收≥1%）但当日收跌；<b>跳空已回补</b>=曾形成跳空收涨，但后续收盘价已跌回前收（按定义不再计入断层）。'+
  '缺口未回补以「首交易日及之后所有收盘价仍高于前收」判定。'+
  '当日及临近公告的个股因次日行情未出，记为「待首日确认」，下一轮刷新可确认。'+
  '<br>行情缺失说明：'+DATA.stocks.length+' 只披露股中，'+esc(sm.dataMissing)+' 只暂未取到日线（多为极新上市股），标「数据待补」并排除在断层信号外；'+
  '其余已按上述规则分类。'+
  '<br>「公告原文 ↗」跳转东方财富个股公告中心（按代码定位）；「导出CSV」按当前筛选结果导出（含BOM，Excel 可直接打开）。每日更新：运行 '+
  '<code>python refresh_via_mx.py '+esc(sm.basisDate)+'</code> 即可刷新。';
['cal-q','cal-type','cal-rpt'].forEach(id=>$('#'+id).addEventListener('input',renderCal));
['gap-status','gap-tag','gap-q'].forEach(id=>$('#'+id).addEventListener('input',renderGap));
$('#cal-export').onclick=()=>downloadCSV('业绩披露', window._calRows||[]);
$('#gap-export').onclick=()=>downloadCSV('净利润断层', window._gapRows||[]);
document.querySelectorAll('.seg button').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  const v=t.dataset.view; $('#view-cal').classList.toggle('hidden',v!=='cal'); $('#view-gap').classList.toggle('hidden',v!=='gap');
});
renderCal(); renderGap(); syncRail();
</script>
</body>
</html>
